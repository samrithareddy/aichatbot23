services:
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    env_file:
      - ../.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../faiss_index:/app/faiss_index:ro
    depends_on:
      - postgres

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_CHAT_WS_URL: ws://localhost:8000/ws/chat
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app

  admin:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    command: streamlit run admin/dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://backend:8000
      DATABASE_URL: postgresql://chatbot:chatbot@postgres:5432/chatbot
    ports:
      - "8501:8501"
    depends_on:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
